name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      MORNYE_DISCORD_SDK: "1"
      MORNYE_PREBUILT_NATIVE: "1"
      MORNYE_RUST_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Signing config
        run: |
          cat > android/key.properties <<PROPS
          storeFile=../ci-signing/vmusic-release.jks
          storePassword=vmusic-local
          keyAlias=vmusic
          keyPassword=vmusic-local
          PROPS

      - run: flutter pub get
      - run: dart scripts/prepare_flutter_sdk.dart
      - run: dart run flutter_launcher_icons
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: vMusic-1.0.9-apk
          path: build/app/outputs/flutter-apk/*.apk
