name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      MORNYE_DISCORD_SDK: "1"
      MORNYE_PREBUILT_NATIVE: "1"
      MORNYE_RUST_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Signing config
        run: |
          cat > android/key.properties <<PROPS
          storeFile=../ci-signing/vmusic-release.jks
          storePassword=vmusic-local
          keyAlias=vmusic
          keyPassword=vmusic-local
          PROPS

      - run: flutter pub get
      - run: dart scripts/prepare_flutter_sdk.dart
      - run: dart run flutter_launcher_icons
      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 -v 2>&1 | tee build.log

      - name: Publish log and APK to build-output branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.log /tmp/out/ 2>/dev/null || true
          cp build/app/outputs/flutter-apk/*.apk /tmp/out/ 2>/dev/null || true
          tail -c 3000000 /tmp/out/build.log > /tmp/out/build-tail.log 2>/dev/null || true
          rm -f /tmp/out/build.log
          cd /tmp/out && git init -q -b build-output
          git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Build ${GITHUB_RUN_NUMBER} (${{ job.status }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-output
